<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuditJE</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <img class="popup__logo" src="public/icon-128.png" alt="">
    <h1>AuditJE</h1>

    <label class="switch">
      <input type="checkbox" id="toggle-extensao" checked aria-describedby="estado-label">
      <span class="switch__track"><span class="switch__thumb"></span></span>
      <span class="sr-only">Ativar ou desativar a extensão nas páginas do PJe</span>
    </label>

    <p id="estado-label" class="popup__estado" role="status">Ativado</p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
